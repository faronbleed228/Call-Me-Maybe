name: Offline regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pydantic==2.14.0 regex==2026.9.29 flake8==7.4.1 mypy==2.4.0
      - run: python -m unittest discover -s tests -v
      - run: flake8 src tests
      - run: mypy src tests --strict
